include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    # CLI tools legitimately use print
    avoid_print: ignore
    unintended_html_in_doc_comment: ignore
