name: magic_notifications
description: Multi-channel notification system for Magic Framework. Supports database (in-app), push (OneSignal), and mail channels.
version: 0.0.3
homepage: https://magic.fluttersdk.com/notifications
documentation: https://magic.fluttersdk.com/packages/notifications/getting-started/installation
repository: https://github.com/fluttersdk/magic_notifications
issue_tracker: https://github.com/fluttersdk/magic_notifications/issues

topics:
  - notifications
  - push-notifications
  - onesignal
  - magic-framework
  - flutter-plugin

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # ^0.0.6 is the floor for `Echo.connection`, which the realtime notification
  # path needs to avoid a second WebSocket on an already-open connection. A 0.0.x
  # caret pins the patch, so ^0.0.5 resolves exactly 0.0.5 and that release has
  # no public connection accessor.
  magic: ^0.0.6
  fluttersdk_artisan: ^0.0.8
  onesignal_flutter: ^5.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0
  flutter_lints: ^6.0.0
